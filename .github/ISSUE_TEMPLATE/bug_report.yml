name: Gameplay or menu bug
description: Report an existing feature that behaves incorrectly in gameplay, menus or the launcher.
title: "[Bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use **Report a bug** on the launcher's **Support** page to fill the environment field automatically.

        For a crash, freeze or startup failure, use the [crash form](https://github.com/OAleex/OpenShao/issues/new?template=crash.yml).
        To suggest a change, use [New feature](https://github.com/OAleex/OpenShao/issues/new?template=feature_request.yml) or [Quality of life](https://github.com/OAleex/OpenShao/issues/new?template=quality_of_life.yml).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The launcher fills this field. If you opened it directly, enter your OpenShao version and operating system.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Story Mode
        - Survival Mode
        - Versus Mode
        - Main menu or Konfigure Recompilation
        - Pause menu
        - Save, load or save pages
        - Kontent, unlockables or secrets
        - Launcher
        - Mods or language packs
        - Other
    validations:
      required: true
  - type: dropdown
    id: players
    attributes:
      label: Players
      options:
        - Single Player
        - Ko-op
        - Two players (Versus)
        - Not in gameplay
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: characters
    attributes:
      label: Playable characters
      description: Select all fighters involved. Name any modded fighter in the report.
      multiple: true
      options:
        - Liu Kang
        - Kung Lao
        - Scorpion
        - Sub-Zero
        - Baraka
        - Johnny Cage
        - Kitana
        - Reptile
        - Other (modded character)
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: For Story or Survival.
      options:
        - Easy
        - Normal
        - Hard
        - Monk
  - type: input
    id: location
    attributes:
      label: In-game location
      description: Enter the chapter, room, arena or Survival level if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List each action from a save or from the main menu.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected OpenShao to do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Rarely
        - Once
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input devices
      description: Keyboard and mouse, or each controller model. Include how they are connected.
  - type: textarea
    id: mods
    attributes:
      label: Enabled mods and language packs
      description: List the enabled mods if they are relevant and you did not attach a diagnostic report.
  - type: textarea
    id: attachments
    attributes:
      label: Diagnostic report, screenshots or video
      description: Attach a reviewed diagnostic ZIP from the launcher's Support page if available. Screenshots or a short video can help show the problem.
