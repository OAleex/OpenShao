name: Crash, freeze or startup failure
description: OpenShao closes, stops responding, shows an error or does not start.
title: "[Crash] "
labels: ["crash", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the launcher opens, go to **Support** and select **Generate report**. Select **Report a bug** to fill in the environment. Review the diagnostic ZIP before attaching it.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The launcher fills this field. If you opened it directly, enter your OpenShao version and operating system.
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What happened?
      options:
        - The game closed
        - The game stopped responding
        - An error message appeared
        - The game does not start
        - The launcher closed or does not open
    validations:
      required: true
  - type: dropdown
    id: moment
    attributes:
      label: When did it happen?
      options:
        - When starting the game
        - During loading
        - In a menu
        - During gameplay
        - During a cutscene or movie
        - When saving or loading
        - When closing the game
        - In the launcher
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Story Mode (Single Player)
        - Story Mode (Ko-op)
        - Survival Mode (Single Player)
        - Survival Mode (Ko-op)
        - Versus Mode
  - type: dropdown
    id: characters
    attributes:
      label: Playable characters
      description: Select all fighters involved. Name any modded fighter in the report.
      multiple: true
      options:
        - Liu Kang
        - Kung Lao
        - Scorpion
        - Sub-Zero
        - Baraka
        - Johnny Cage
        - Kitana
        - Reptile
        - Other (modded character)
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: For Story or Survival.
      options:
        - Easy
        - Normal
        - Hard
        - Monk
  - type: input
    id: location
    attributes:
      label: In-game location or menu
      description: Enter the chapter, room, arena, Survival level or menu if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happened once, describe what you were doing right before it happened.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact text of any message.
      render: text
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Rarely
        - Once
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and drivers
      description: List your processor, graphics card and driver version if known and you did not attach a diagnostic report.
  - type: textarea
    id: mods
    attributes:
      label: Enabled mods and language packs
      description: List the enabled mods if they are relevant and you did not attach a diagnostic report.
  - type: textarea
    id: attachments
    attributes:
      label: Diagnostic report
      description: Attach the reviewed diagnostic ZIP if you can generate one. It includes the crash dump when available.
