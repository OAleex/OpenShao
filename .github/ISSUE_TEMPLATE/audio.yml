name: Audio, voice or dialogue problem
description: Missing, cut, repeated, wrong-language or distorted music, effects, voices or subtitles.
title: "[Audio] "
labels: ["audio", "needs triage"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the environment copied by **Report a bug** on the launcher's Support page. Otherwise, enter your OpenShao version and operating system.
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      multiple: true
      options:
        - Missing voice line or dialogue
        - Voice line cut off or repeated
        - Wrong voice language
        - Subtitle or on-screen text does not match the voice
        - Music missing, stops or restarts
        - Sound effect missing or too loud
        - Crackling, distortion or wrong speaker channels
        - Audio out of sync with a cutscene
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Audio output
      description: Konfigure Recompilation > Audio.
      options:
        - Mono
        - Stereo
        - Surround
  - type: dropdown
    id: restored_dialogue
    attributes:
      label: Restore Lost Dialogue
      description: The setting in Enhancements.
      options:
        - "On"
        - "Off"
        - Same problem with both settings
  - type: dropdown
    id: characters
    attributes:
      label: Playable characters
      description: Select all fighters involved. Name any modded fighter in the report.
      multiple: true
      options:
        - Liu Kang
        - Kung Lao
        - Scorpion
        - Sub-Zero
        - Baraka
        - Johnny Cage
        - Kitana
        - Reptile
        - Other (modded character)
  - type: input
    id: location
    attributes:
      label: In-game location
      description: Enter the chapter, room, cutscene, arena or Survival level if relevant.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what you hear, what you expected and how to reach that moment.
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Audio device
      description: Speakers or headphones, and how they are connected.
  - type: textarea
    id: mods
    attributes:
      label: Enabled mods and language packs
      description: List relevant mods or language packs if you did not attach a diagnostic report.
  - type: textarea
    id: attachments
    attributes:
      label: Recording and diagnostic report
      description: Attach a short recording or a reviewed diagnostic ZIP from the launcher's Support page if available.
