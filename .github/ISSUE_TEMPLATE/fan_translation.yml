name: Offer translation help
description: Offer to translate OpenShao into a new language.
title: "[Translation offer] "
labels: ["fan translation", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Offer to translate OpenShao into a language that is not yet available.
        The maintainer can contact you to provide the translation materials and instructions.
  - type: dropdown
    id: language
    attributes:
      label: Which languages would you like to translate OpenShao into?
      description: Select languages not yet available in the game or as mods. Select Other for an unlisted language or regional variant.
      multiple: true
      options:
        - Arabic
        - Bulgarian
        - Chinese (Simplified)
        - Chinese (Traditional)
        - Czech
        - Danish
        - Dutch
        - Finnish
        - Greek
        - Hungarian
        - Indonesian
        - Japanese
        - Korean
        - Malay
        - Norwegian
        - Polish
        - Portuguese (Portugal)
        - Romanian
        - Russian
        - Spanish (Latin America)
        - Swedish
        - Thai
        - Turkish
        - Ukrainian
        - Vietnamese
        - Other
    validations:
      required: true
  - type: input
    id: other_language
    attributes:
      label: Other language or regional variant
      description: If you selected Other, name the languages or regional variants you can translate. The maintainer can review your offer.
  - type: input
    id: contact
    attributes:
      label: How can the maintainer contact you?
      description: Provide an email address, Discord username or profile that accepts messages. This issue is public.
    validations:
      required: true
