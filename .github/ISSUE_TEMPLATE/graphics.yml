name: Graphics or performance problem
description: Missing or wrong graphics, menu or HUD layout problems, stutter or low frame rate.
title: "[Graphics] "
labels: ["graphics", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        A screenshot helps show a visual problem. A short video helps show stutter or animation problems.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the environment copied by **Report a bug** on the launcher's Support page. Otherwise, enter your OpenShao version and operating system.
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      multiple: true
      options:
        - Missing, flickering or stretched geometry
        - Wrong colors, lighting, shadows or bloom
        - HUD, menu or text layout
        - Problem with one aspect ratio or resolution
        - Cutscene or movie playback
        - Stutter when entering an area or seeing an effect for the first time
        - Low or unstable frame rate
        - Problem at a frame rate limit above 60 FPS
    validations:
      required: true
  - type: dropdown
    id: renderers
    attributes:
      label: Does the other renderer show the same problem?
      description: Windows offers Direct3D 12 and Vulkan on the launcher's Graphics page.
      options:
        - It also happens with the other renderer
        - It happens only with the renderer in the environment
        - I did not test the other renderer
        - Not available on my system
  - type: dropdown
    id: characters
    attributes:
      label: Playable characters
      description: Select all fighters involved. Name any modded fighter in the report.
      multiple: true
      options:
        - Liu Kang
        - Kung Lao
        - Scorpion
        - Sub-Zero
        - Baraka
        - Johnny Cage
        - Kitana
        - Reptile
        - Other (modded character)
  - type: input
    id: location
    attributes:
      label: In-game location or menu
      description: Enter the chapter, room, arena, Survival level or menu if relevant.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what you see, what you expected and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Graphics card and driver
      description: List the graphics card and driver version if known and you did not attach a diagnostic report.
  - type: textarea
    id: mods
    attributes:
      label: Enabled mods and language packs
      description: List the enabled mods if they are relevant and you did not attach a diagnostic report.
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, video and diagnostic report
      description: Attach a screenshot, a short video or a reviewed diagnostic ZIP from the launcher's Support page.
