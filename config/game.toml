# Recompiler profile for the USA/Europe executable. ABI corrections appear inline.

[xbe]
path = "assets/default.xbe"
# SDK export metadata; OpenShao links the generated code into its executable.
library = "OpenShao.dll"
title = 0x4D570029
entry = 0xF40CA
xdk = 5849
out = "generated/openshao"
partitions = 128
code_sections = [".text", "D3D", "XGRPH", "DSOUND", "D3DX", "PSFD00", "WMADEC", "XPP"]

# extra entry points
[functions]

[[function]]
at = 0x00011BCC
end = 0x00011BD1 # original options callback thunk (JMP 0x000A2790); reached via a function pointer

[[function]]
at = 0x000F1A07
end = 0x000F1A31 # thread lifecycle callback, registered by the original CRT at 0x000ED2AD; RET4

